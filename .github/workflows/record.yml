name: Record HKJC Quinella
on:
  schedule:
    # UTC, Hong Kong 11:07–21:47. HKJC's meeting calendar gates the long job.
    - cron: '7,27,47 3-13 * * *'
  workflow_dispatch:
    inputs:
      write_test:
        description: Verify private archive writes without race data
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hkjc-qin-live
  cancel-in-progress: false
jobs:
  record:
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -u recorder.py
        env:
          QIN_WRITE_TEST: ${{ inputs.write_test }}
          PRIVATE_DATA_REPO: ${{ vars.PRIVATE_DATA_REPO }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
